<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>보석 팡팡</title>
<style>
  :root { --bg:#14102a; --panel:#221a44; --accent:#ffd84d; --text:#f2eefe; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(circle at 50% 0%,#2d2160,var(--bg)); color:var(--text);
         font-family:"Segoe UI","Malgun Gothic",sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; user-select:none; }
  h1 { margin:4px 0 10px; font-size:28px; letter-spacing:2px; color:var(--accent); text-shadow:0 2px 0 #7a4b00; }
  .hud { width:min(92vmin,560px); display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; }
  .stat { background:var(--panel); border-radius:10px; padding:6px 12px; min-width:80px; text-align:center; }
  .stat small { display:block; opacity:.6; font-size:11px; }
  .stat b { font-size:20px; }
  canvas { width:min(92vmin,560px); height:min(92vmin,560px); border-radius:14px; box-shadow:0 10px 40px #0008; touch-action:none; cursor:pointer; }
  .bar { width:min(92vmin,560px); height:14px; background:var(--panel); border-radius:7px; margin-top:10px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#3ddc84,#ffd84d); transition:width .3s; }
  .btns { margin-top:12px; display:flex; gap:10px; }
  button { background:var(--panel); color:var(--text); border:2px solid #4a3c8a; border-radius:10px; padding:8px 18px; font-size:15px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  .help { opacity:.55; font-size:13px; margin-top:10px; text-align:center; }
</style>
</head>
<body>
<h1>💎 보석 팡팡</h1>
<div class="hud">
  <div class="stat"><small>점수</small><b id="score">0</b></div>
  <div class="stat"><small>레벨</small><b id="level">1</b></div>
  <div class="stat"><small>최고</small><b id="best">0</b></div>
</div>
<canvas id="cv"></canvas>
<div class="bar"><i id="prog"></i></div>
<div class="btns">
  <button id="hintBtn">💡 힌트</button>
  <button id="newBtn">🔄 새 게임</button>
  <button id="soundBtn">🔊 소리</button>
</div>
<div class="help">같은 보석 3개 이상을 가로·세로로, 또는 2×2 사각형으로 맞추세요. 클릭 두 번 또는 드래그로 교환!</div>

<script>
const N = 8, T = 7;
const COLORS = [
  ['#ff6b7a', '#b0102a'], // 빨강 - 둥근 사각
  ['#ffb347', '#c25a00'], // 주황 - 육각
  ['#fff07a', '#c49a00'], // 노랑 - 별
  ['#6dffa8', '#0f8a45'], // 초록 - 원
  ['#7fdcff', '#0a74b8'], // 하늘 - 마름모
  ['#d29bff', '#6a1fb8'], // 보라 - 삼각
  ['#ff9ee0', '#c2268f'], // 분홍 - 하트
];
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, CS = 0;
let grid = [], sel = null, busy = false, score = 0, level = 1, combo = 0, hint = null;
let particles = [], floats = [], waiters = [], banner = null, sound = true;
let best = 0; try { best = +localStorage.getItem('gempang-best') || 0; } catch (e) {}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const size = cv.getBoundingClientRect().width;
  cv.width = cv.height = Math.round(size * dpr);
  W = cv.width; CS = W / N;
}
window.addEventListener('resize', resize);

const rnd = () => Math.floor(Math.random() * T);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const gem = (t, r, c, y) => ({ t, r, c, x: c, y: y ?? r, v: 0, s: 1, dying: false, pop: 0 });

// ---------- 보드 로직 ----------
function types() { return grid.map(row => row.map(g => g.t)); }
function matchAt(tt, r, c) {
  const t = tt[r][c]; let h = 1, v = 1;
  for (let k = c - 1; k >= 0 && tt[r][k] === t; k--) h++;
  for (let k = c + 1; k < N && tt[r][k] === t; k++) h++;
  for (let k = r - 1; k >= 0 && tt[k][c] === t; k--) v++;
  for (let k = r + 1; k < N && tt[k][c] === t; k++) v++;
  if (h >= 3 || v >= 3) return true;
  // 2×2 사각형
  for (let r0 = r - 1; r0 <= r; r0++) for (let c0 = c - 1; c0 <= c; c0++) {
    if (r0 < 0 || c0 < 0 || r0 + 1 >= N || c0 + 1 >= N) continue;
    if (tt[r0][c0] === t && tt[r0 + 1][c0] === t && tt[r0][c0 + 1] === t && tt[r0 + 1][c0 + 1] === t) return true;
  }
  return false;
}
function findMove() {
  const tt = types();
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const r2 = r + dr, c2 = c + dc; if (r2 >= N || c2 >= N) continue;
      [tt[r][c], tt[r2][c2]] = [tt[r2][c2], tt[r][c]];
      const ok = matchAt(tt, r, c) || matchAt(tt, r2, c2);
      [tt[r][c], tt[r2][c2]] = [tt[r2][c2], tt[r][c]];
      if (ok) return [{ r, c }, { r: r2, c: c2 }];
    }
  }
  return null;
}
function findMatches() {
  const set = new Set(), runs = [];
  const scan = get => {
    for (let a = 0; a < N; a++) {
      let s = 0;
      while (s < N) {
        let e = s + 1;
        while (e < N && get(a, e).t === get(a, s).t) e++;
        if (e - s >= 3) { const run = []; for (let k = s; k < e; k++) { set.add(get(a, k)); run.push(get(a, k)); } runs.push(run); }
        s = e;
      }
    }
  };
  scan((a, b) => grid[a][b]);
  scan((a, b) => grid[b][a]);
  // 2×2 사각형
  for (let r = 0; r < N - 1; r++) for (let c = 0; c < N - 1; c++) {
    const sq = [grid[r][c], grid[r][c + 1], grid[r + 1][c], grid[r + 1][c + 1]];
    if (sq.every(g => g.t === sq[0].t)) { sq.forEach(g => set.add(g)); runs.push(sq); }
  }
  return { set, runs };
}
function randomFill(spawnAbove) {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    let t;
    do { t = rnd(); } while ((c >= 2 && grid[r][c - 1].t === t && grid[r][c - 2].t === t) ||
                             (r >= 2 && grid[r - 1][c].t === t && grid[r - 2][c].t === t) ||
                             (r >= 1 && c >= 1 && grid[r - 1][c].t === t && grid[r][c - 1].t === t && grid[r - 1][c - 1].t === t));
    if (spawnAbove) grid[r][c] = gem(t, r, c, r - N - 1 - (N - r) * 0.3);
    else { grid[r][c].t = t; grid[r][c].pop = 1; }
  }
}
function newBoard() {
  do { grid = Array.from({ length: N }, () => Array(N).fill(null)); randomFill(true); } while (!findMove());
}

function swapCells(a, b) {
  const g1 = grid[a.r][a.c], g2 = grid[b.r][b.c];
  grid[a.r][a.c] = g2; grid[b.r][b.c] = g1;
  g1.r = b.r; g1.c = b.c; g2.r = a.r; g2.c = a.c;
}
function settle() { return new Promise(res => waiters.push(res)); }

async function trySwap(a, b) {
  busy = true; sel = null; hint = null;
  swapCells(a, b); beep(330, 0.05);
  await settle();
  let m = findMatches();
  if (!m.set.size) { swapCells(a, b); beep(160, 0.08); await settle(); busy = false; return; }
  combo = 0;
  await resolve(m);
  busy = false;
}

async function resolve(m) {
  while (m.set.size) {
    combo++;
    let pts = 0;
    for (const run of m.runs) pts += run.length * 10 + Math.max(0, run.length - 3) * 30;
    pts *= combo;
    addScore(pts);
    let sx = 0, sy = 0;
    for (const g of m.set) { g.dying = true; sx += g.c; sy += g.r; burst(g); }
    floats.push({ x: sx / m.set.size + 0.5, y: sy / m.set.size + 0.5, text: '+' + pts + (combo > 1 ? '  x' + combo : ''), life: 1 });
    beep(400 + combo * 90, 0.12);
    await sleep(230);
    for (const g of m.set) grid[g.r][g.c] = null;
    gravity();
    await settle();
    m = findMatches();
  }
  if (!findMove()) {
    banner = { text: '움직일 수 없어요! 섞는 중…', life: 1.6 };
    await sleep(700);
    do { randomFill(false); } while (!findMove());
    await sleep(400);
  }
}

function gravity() {
  for (let c = 0; c < N; c++) {
    let w = N - 1;
    for (let r = N - 1; r >= 0; r--) {
      const g = grid[r][c];
      if (g) { grid[r][c] = null; grid[w][c] = g; g.r = w; w--; }
    }
    const cnt = w + 1;
    for (let r = w; r >= 0; r--) grid[r][c] = gem(rnd(), r, c, r - cnt - 0.5);
  }
}

function addScore(p) {
  score += p;
  const need = level * 1500;
  if (score >= need) { level++; banner = { text: '레벨 ' + level + '!', life: 1.6 }; beep(880, 0.25); }
  if (score > best) { best = score; try { localStorage.setItem('gempang-best', best); } catch (e) {} }
  updateHud();
}
function updateHud() {
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = level;
  document.getElementById('best').textContent = best;
  const lo = (level - 1) * 1500, hi = level * 1500;
  document.getElementById('prog').style.width = Math.min(100, (score - lo) / (hi - lo) * 100) + '%';
}

// ---------- 효과 ----------
function burst(g) {
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 3;
    particles.push({ x: g.c + 0.5, y: g.r + 0.5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, col: COLORS[g.t][0] });
  }
}
let actx = null;
function beep(f, d) {
  if (!sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), gn = actx.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    gn.gain.setValueAtTime(0.12, actx.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d);
    o.connect(gn); gn.connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
  } catch (e) {}
}

// ---------- 그리기 ----------
function shapePath(t, R) {
  ctx.beginPath();
  const poly = (n, rot, rr = R) => { for (let i = 0; i < n; i++) { const a = rot + i * 2 * Math.PI / n; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); };
  switch (t) {
    case 0: { const s = R * 0.82, k = R * 0.28; ctx.roundRect ? ctx.roundRect(-s, -s, s * 2, s * 2, k) : ctx.rect(-s, -s, s * 2, s * 2); break; }
    case 1: poly(6, 0); break;
    case 2: for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? R * 0.48 : R * 1.05; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); break;
    case 3: ctx.arc(0, 0, R * 0.9, 0, Math.PI * 2); break;
    case 4: ctx.moveTo(0, -R); ctx.lineTo(R * 0.75, 0); ctx.lineTo(0, R); ctx.lineTo(-R * 0.75, 0); ctx.closePath(); break;
    case 5: poly(3, -Math.PI / 2, R * 1.05); ctx.translate(0, 0); break;
    case 6:
      ctx.moveTo(0, R * 0.9);
      ctx.bezierCurveTo(-R * 1.3, -R * 0.1, -R * 0.6, -R * 1.1, 0, -R * 0.4);
      ctx.bezierCurveTo(R * 0.6, -R * 1.1, R * 1.3, -R * 0.1, 0, R * 0.9);
      ctx.closePath(); break;
  }
}
function drawGem(g, now) {
  const [light, dark] = COLORS[g.t];
  const cx = (g.x + 0.5) * CS, cy = (g.y + 0.5) * CS;
  let s = g.s;
  if (g.pop > 0) s *= 1 + Math.sin(g.pop * Math.PI) * 0.25;
  const isHint = hint && hint.some(h => h.r === g.r && h.c === g.c);
  if (isHint) s *= 1 + Math.sin(now / 120) * 0.08;
  const R = CS * 0.4 * s;
  if (R <= 0) return;
  ctx.save(); ctx.translate(cx, cy);
  if (sel && sel.r === g.r && sel.c === g.c && !g.dying) ctx.rotate(Math.sin(now / 150) * 0.15);
  shapePath(g.t, R);
  const gr = ctx.createRadialGradient(-R * 0.35, -R * 0.4, R * 0.1, 0, 0, R * 1.2);
  gr.addColorStop(0, '#fff'); gr.addColorStop(0.25, light); gr.addColorStop(1, dark);
  ctx.fillStyle = gr; ctx.shadowColor = '#0007'; ctx.shadowBlur = CS * 0.08; ctx.shadowOffsetY = CS * 0.04;
  ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.lineWidth = CS * 0.03; ctx.strokeStyle = dark; ctx.stroke();
  // 광택
  ctx.beginPath(); ctx.ellipse(-R * 0.25, -R * 0.35, R * 0.28, R * 0.14, -0.6, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();
  ctx.restore();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  // 이동
  let moving = false;
  for (const row of grid) for (const g of row) {
    if (!g) continue;
    if (g.y < g.r) { g.v = Math.min(g.v + 60 * dt, 22); g.y = Math.min(g.r, g.y + g.v * dt); if (g.y === g.r) { g.v = 0; g.pop = 0.5; } }
    else if (g.y > g.r) { g.y = Math.max(g.r, g.y - 9 * dt); }
    if (g.x !== g.c) g.x += Math.sign(g.c - g.x) * Math.min(Math.abs(g.c - g.x), 9 * dt);
    if (g.dying) g.s = Math.max(0, g.s - dt * 5);
    if (g.pop > 0) g.pop = Math.max(0, g.pop - dt * 4);
    if (g.x !== g.c || g.y !== g.r) moving = true;
  }
  if (!moving && waiters.length) { const w = waiters; waiters = []; w.forEach(f => f()); }

  // 배경
  ctx.clearRect(0, 0, W, W);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    ctx.fillStyle = (r + c) % 2 ? '#2a2152' : '#332863';
    ctx.fillRect(c * CS, r * CS, CS, CS);
  }
  if (sel) {
    ctx.strokeStyle = '#ffd84d'; ctx.lineWidth = CS * 0.05;
    ctx.strokeRect(sel.c * CS + CS * 0.05, sel.r * CS + CS * 0.05, CS * 0.9, CS * 0.9);
  }
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, W); ctx.clip();
  for (const row of grid) for (const g of row) if (g) drawGem(g, now);
  ctx.restore();

  // 파티클
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 6 * dt; p.life -= dt * 1.6;
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x * CS, p.y * CS, CS * 0.07 * p.life + 1, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 점수 팝업
  floats = floats.filter(f => f.life > 0);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floats) {
    f.life -= dt * 0.9; f.y -= dt * 0.8;
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.font = `bold ${CS * 0.4}px "Segoe UI",sans-serif`;
    ctx.lineWidth = CS * 0.08; ctx.strokeStyle = '#000a'; ctx.strokeText(f.text, f.x * CS, f.y * CS);
    ctx.fillStyle = '#fff'; ctx.fillText(f.text, f.x * CS, f.y * CS);
  }
  ctx.globalAlpha = 1;
  if (banner) {
    banner.life -= dt;
    if (banner.life <= 0) banner = null;
    else {
      ctx.globalAlpha = Math.min(1, banner.life * 2);
      ctx.fillStyle = '#000a'; ctx.fillRect(0, W / 2 - CS * 0.7, W, CS * 1.4);
      ctx.font = `bold ${CS * 0.55}px "Malgun Gothic",sans-serif`;
      ctx.fillStyle = '#ffd84d'; ctx.fillText(banner.text, W / 2, W / 2);
      ctx.globalAlpha = 1;
    }
  }
  requestAnimationFrame(frame);
}

// ---------- 입력 ----------
let down = null;
function cellAt(e) {
  const rc = cv.getBoundingClientRect();
  const c = Math.floor((e.clientX - rc.left) / rc.width * N), r = Math.floor((e.clientY - rc.top) / rc.height * N);
  return r >= 0 && r < N && c >= 0 && c < N ? { r, c } : null;
}
const adj = (a, b) => Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;
cv.addEventListener('pointerdown', e => {
  if (busy) return;
  const p = cellAt(e); if (!p) return;
  down = { ...p, x: e.clientX, y: e.clientY };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!down || busy) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  const th = cv.getBoundingClientRect().width / N * 0.35;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < th) return;
  const to = Math.abs(dx) > Math.abs(dy) ? { r: down.r, c: down.c + Math.sign(dx) } : { r: down.r + Math.sign(dy), c: down.c };
  const from = { r: down.r, c: down.c }; down = null;
  if (to.r >= 0 && to.r < N && to.c >= 0 && to.c < N) trySwap(from, to);
});
cv.addEventListener('pointerup', () => {
  if (!down || busy) { down = null; return; }
  const p = { r: down.r, c: down.c }; down = null;
  if (sel && adj(sel, p)) trySwap(sel, p);
  else if (sel && sel.r === p.r && sel.c === p.c) sel = null;
  else { sel = p; beep(520, 0.04); }
});

document.getElementById('hintBtn').onclick = () => { if (!busy) { hint = findMove(); score = Math.max(0, score - 20); updateHud(); } };
document.getElementById('newBtn').onclick = () => { if (busy) return; score = 0; level = 1; sel = hint = null; newBoard(); updateHud(); };
document.getElementById('soundBtn').onclick = e => { sound = !sound; e.target.textContent = sound ? '🔊 소리' : '🔇 소리'; };

resize(); newBoard(); updateHud(); requestAnimationFrame(frame);
</script>
</body>
</html>

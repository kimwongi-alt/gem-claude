# main에 푸시하면 React 버전을 테스트·빌드해서 GitHub Pages에 배포한다.
# 사이트 구성:
#   /               → React 버전 (gem-react/dist)
#   /gem-game.html  → 기존 HTML 버전 (클래식)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gem-react
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gem-react/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: 사이트 폴더 구성
        run: |
          mkdir -p ../_site
          cp -r dist/. ../_site/
          cp ../gem-game.html ../_site/gem-game.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
